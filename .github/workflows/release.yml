name: Check and publish

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Record tested commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Pin npm
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Collect dashboard test results
        if: always()
        run: |
          test_status=0
          npx vitest run --reporter=json --outputFile=check-results/vitest-results.json || test_status=$?
          node scripts/dashboard-test-summary.mjs
          exit "$test_status"
      - name: Upload dashboard test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence
          path: check-results/test-summary.json
          if-no-files-found: error
          retention-days: 90

  release:
    if: github.ref == 'refs/heads/main'
    needs: check
    concurrency:
      group: npm-release-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.check.outputs.sha }}
      - name: Configure Tagger upstream
        env:
          TESTED_SHA: ${{ needs.check.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git fetch --tags origin +refs/heads/main:refs/remotes/origin/main
          git switch -C main "$TESTED_SHA"
          git branch --set-upstream-to=origin/main main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Pin npm
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"
      - run: npm ci
      - name: Calculate release version
        id: version
        run: |
          version="$(npm run --silent release:version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == "0.0.0" || "$version" == *-SNAPSHOT ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refuse an existing npm version
        if: steps.version.outputs.publish == 'true'
        env:
          PACKAGE: "@continuous-excellence/testmints-js"
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          published="$(npm view "$PACKAGE@$RELEASE_VERSION" version --prefer-online 2>/dev/null || true)"
          test -z "$published" || {
            echo "$PACKAGE@$RELEASE_VERSION is already published." >&2
            exit 1
          }
      - name: Build the release tarball
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run release:pack
      - name: Verify the release tarball as a consumer
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run release:verify -- .release/*.tgz
      - name: Compare with the published package
        id: comparison
        if: steps.version.outputs.publish == 'true'
        run: |
          decision="$(node scripts/compare-release.mjs @continuous-excellence/testmints-js .release/*.tgz)"
          echo "$decision" >> "$GITHUB_OUTPUT"
      - name: Publish with npm trusted publishing
        if: steps.comparison.outputs.publish == 'true'
        run: npm publish .release/*.tgz --access public
      - name: Confirm npm publication
        if: steps.comparison.outputs.publish == 'true'
        env:
          PACKAGE: "@continuous-excellence/testmints-js"
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in {1..60}; do
            published="$(npm view "$PACKAGE@$RELEASE_VERSION" version --prefer-online 2>/dev/null || true)"
            if [ "$published" = "$RELEASE_VERSION" ]; then exit 0; fi
            echo "Waiting for $PACKAGE@$RELEASE_VERSION (attempt $attempt of 60)."
            sleep 5
          done
          exit 1
      - name: Tag the published release
        if: steps.comparison.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run --silent release:tag -- "${{ steps.version.outputs.version }}"
